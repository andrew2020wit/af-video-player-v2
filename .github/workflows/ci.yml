name: CI

on:
  push:
  pull_request:

env:
  QT_VERSION: "6.10.3"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            preset: windows
            qt-arch: win64_msvc2022_64
          - name: Linux
            os: ubuntu-24.04
            preset: unix
            qt-arch: linux_gcc_64
          - name: macOS
            os: macos-14
            preset: unix
            qt-arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch libmpv and FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-deps-windows.ps1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libmpv-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libgl-dev libxkbcommon-dev libegl1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config mpv ffmpeg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
